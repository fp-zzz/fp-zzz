<svg xmlns="http://www.w3.org/2000/svg" width="985" height="550" viewBox="0 0 985 550" xml:space="preserve">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace; font-size: 16px; fill: #ededed; white-space: pre; }
    .card { fill: none; stroke: #3d3d3d; }
    .k { fill: #9a9a9a; }
    .h { fill: #ffffff; font-weight: bold; }
    .art text { font-size: 10px; font-weight: bold; fill: #ffffff; }
    .d { fill: #555555; }
    .add { fill: #ffffff; }
    .del { fill: #8a8a8a; }
    .strip { fill: #ffffff; }
    .planet text { fill: url(#sweep); }
    .base { stop-color: #c9c9c9; }
    .glow { stop-color: #ffffff; }
    .art .star text, .art .tw { text-anchor: middle; }
    .star { animation: pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .tw { animation: twinkle 3s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.6; transform: scale(0.88); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .cursor { animation: blink 1.1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <defs>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="290" x2="350" y2="70">
      <stop class="base" offset="0.4"/>
      <stop class="glow" offset="0.5"/>
      <stop class="base" offset="0.6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-420 260; 420 -260; 420 -260" keyTimes="0; 0.55; 1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

